<html>
	<head>
		<title>Harshada Nizare</title>
	</head>
	<body bg style="background-image: linear-gradient(to top, #96fbc4 0%, #f9f586 100%);">
		<form>
		<table  border="2" cellspacing="2" cellpadding="10" align="center">
		<caption><font size="5" color="blue" face="Arial"><b>Registration Form</b></font></caption>
		<tr>
		<td>Name: </td>
		<td><input type="text" placeholder="First Name">
			<input type="text" placeholder="Middle Name">
			<input type="text" placeholder="Last Name"></td>
		</tr>
		<tr>
		<td>Email: </td>
		<td><input type="text" placeholder ="Email id"></td>
		</tr>
		<tr>
		<td>Password: </td>
		<td><input type="password" placeholder="Password"></td>
		</tr>
		<tr>
		<td>Gender: </td>
		<td><input type="radio" name="gender"/>Male
		    <input type="radio" name="gender"/>Female
		    <input type="radio" name="gender"/>Other
		</td>
		</tr>
		<tr>
		<td>Agree to Terms and Condition: </td>
		<td><input type="checkbox"></td>
	    </tr>
		<tr>
		<td>Country: </td>
		<td>
		<select>
			<option>United Kingdom</option>
			<option>India</option>
			<option>America</option>
			<option>Canada</option>
		</select>
		</td>
		</tr>
		<tr>
		<td>Additional Information: </td>
		<td><textarea id="txt" name="txt" rows="4" cols="50"></textarea></td>
		</tr>
		<tr>
		<td colspan="2" align="center"><input type="submit"> </td>
		</tr>
		</table>
		</form>
	</body>
</html>
